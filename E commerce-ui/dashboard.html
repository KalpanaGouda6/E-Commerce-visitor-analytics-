<html>
    <head>
  <title>Analytics Dashboard</title>

   <!--Bootstrap CDN-->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
   rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
    crossorigin="anonymous">

    <!--chart JS-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>



    </head>
    <body onload="loadDashboard()">
     <!--Main Div Start-->
     <div class="container">
        <br>
        <h2>Analytics Dashboard</h2>

        <br>

        <!--Data Points - Card Start-->
        <div class="row">
            <div class="col-lg-3 col-sm-12">
                <!--card start-->
                <div class="card" style="background-color:#32a852">
                 <div class="card-body">
                    <h5 class="card-title" style="color:white;">Today's Visitors</h5>
                    <h2 class="card-title"style="color:white;"id="todayVisitors"></h2>

                 </div>
                </div>
                <!--card end-->

            </div>
            <div class="col-lg-3 col-sm-12">
                <!--card start-->
                <div class="card" style="background-color:blue">
                    <div class="card-body">
                       <h5 class="card-title" style="color:white;">Ad Clicks</h5>
                       <h2 class="card-title"style="color:white;">100</h2>
   
                    </div>
                   </div>
                   <!--card end-->

            </div>
            <div class="col-lg-3 col-sm-12">
              <!--card start-->
              <div class="card" style="background-color:brown">
                <div class="card-body">
                   <h5 class="card-title" style="color:white;">Product Clicks</h5>
                   <h2 class="card-title"style="color:white;">70</h2>

                </div>
               </div>
               <!--card end-->
            </div>
            <div class="col-lg-3 col-sm-12">
 <!--card start-->
 <div class="card" style="background-color:skyblue">
    <div class="card-body">
       <h5 class="card-title" style="color:white;">No of Enquiries</h5>
       <h2 class="card-title"style="color:white;">20</h2>

    </div>
   </div>
   <!--card end-->
            </div>

        </div>
        <!--Data Points - Card End-->

        <br><br>

      <!--Table & Graph Start-->
      <div class="row">
        <div class="col-lg-6 col-sm-12">
          
            <!--Table Start-->
            <table class="table">
                <thead>
                <tr class="table-dark">
                    <td>Sl</td>
                    <td>Name</td>
                    <td>Email / Mobile</td>
                    <td>Comments</td>
                </tr>
                </thead>
                <tbody>
              <tr>
                <td>1</td>
                <td>Ramesh</td>
                <td>ramesh@gmail.com / 7070707070</td>
                <td>Price of 10 Smart phones</td>
              </tr>
              <tr>
                <td>2</td>
                <td>Suresh</td>
                <td>suresh@gmail.com / 8080808080</td>
                <td>looking 20 Airpods</td>
              </tr>
                </tbody>
            </table>
            <!--Table End-->
        </div>
        <div class="col-lg-6 col-sm-12">
            <div>
                <canvas id="myChart"></canvas>
              </div>   
           </div>
        
      </div>
      <!--Table & Graph End-->
     </div>
     <!--Main Div End-->

     <script>
        

         const labels = ['Jan','FEb','Mar','Apr','May','Jun','Jul']
const data = {
  labels: labels,
  datasets: [{
    label: 'Trend of Visitors over the month',
    data: [65, 59, 80, 81, 56, 55, 40],
    backgroundColor: [
      'rgba(255, 99, 132, 0.2)',
      'rgba(255, 159, 64, 0.2)',
      'rgba(255, 205, 86, 0.2)',
      'rgba(75, 192, 192, 0.2)',
      'rgba(54, 162, 235, 0.2)',
      'rgba(153, 102, 255, 0.2)',
      'rgba(201, 203, 207, 0.2)'
    ],
    borderColor: [
      'rgb(255, 99, 132)',
      'rgb(255, 159, 64)',
      'rgb(255, 205, 86)',
      'rgb(75, 192, 192)',
      'rgb(54, 162, 235)',
      'rgb(153, 102, 255)',
      'rgb(201, 203, 207)'
    ],
    borderWidth: 1
  }]
};

const config = {
  type: 'bar',
  data: data,
  options: {
    scales: {
      y: {
        beginAtZero: true
      }
    }
  },
};
const myChart = new Chart(document.getElementById('myChart'),
config


);
function loadDashboard()
{
  /*AJAX code to recieve data from server*/
  var xhttpVisitors = new XMLHttpRequest()
  xhttpVisitors.onreadystatechange = function()
          {
              if(this.readyState == 4 && this.status == 200)
              {
              var jsonData = JSON.parse(this.responseText)
              var todayCount=jsonData[0].count
              document.getElementById('todayVisitors').innerHTML=todayCount

              }
          }  
          xhttpVisitors.open('GET','http://localhost:5000/today-visitors',true)
          xhttpVisitors.send() 
          /* ENd AJAX Code - Today Visitors */

          /* AJAX Code Contact Count Start */
          var xhttpContact = new XMLHttpRequest()
                xhttpContact.onreadystatechange = function()
                {
                    if(this.readyState == 4 && this.status == 200)
                    {
                        var jsonData = JSON.parse(this.responseText)
                        var totalContactCount = jsonData[0].contact_count_today

                        document.getElementById('todayContactCount').innerHTML = totalContactCount
                    }   
                }
                xhttpContact.open('GET','http://localhost:5000/contacts-count', true)
                xhttpContact.send()  
                /* AJAX Code Contact Count End */
}
     </script>
    </body>
</html>
